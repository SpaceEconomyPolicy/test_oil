[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "fuel-contour-2035"
version = "0.1.0"
description = "Interactive calculation core for the educational case Toplivny kosmokontur 2035"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
app = ["streamlit>=1.40,<2", "plotly>=5.24,<7", "matplotlib>=3.9,<4"]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
